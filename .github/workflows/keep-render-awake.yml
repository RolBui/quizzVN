name: Keep Render Awake

on:
  schedule:
    # Render Free spins down after 15 minutes of no inbound traffic.
    # GitHub scheduled workflows can be delayed, so ping every 5 minutes.
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-render-awake
  cancel-in-progress: false

jobs:
  ping:
    name: Ping backend health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      KEEP_ALIVE_URL: ${{ vars.RENDER_KEEP_ALIVE_URL || 'https://quizzvn.onrender.com/health' }}
    steps:
      - name: Request health check
        run: |
          echo "Pinging ${KEEP_ALIVE_URL}"
          curl --fail --silent --show-error --location \
            --max-time 70 \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            "${KEEP_ALIVE_URL}"
          echo
